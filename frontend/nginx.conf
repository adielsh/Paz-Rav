server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: client-side routes fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy to the FastAPI service.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The Flex statement endpoint pulls a ~30 MB XML from IBKR and can be
        # throttled by them; 30s here surfaced as a 504 with no data on the page.
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}
