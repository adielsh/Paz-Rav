server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Discover all containers via the Docker socket and ship their stdout/stderr to Loki.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
      # Only keep our project's containers (condor-* and ibgw-paper).
      - source_labels: ['container']
        regex: '(condor-.*|ibgw-paper)'
        action: keep
    pipeline_stages:
      # trading-core / api emit JSON lines — parse them so fields become queryable labels.
      - match:
          selector: '{container=~"condor-core|condor-api"}'
          stages:
            - json:
                expressions:
                  level: level
                  logger: logger
                  msg: msg
                  trade_id: trade_id
                  gate: gate
                  reason: reason
            - labels:
                level:
                logger:
